# moNa2 (PAW3222 trackball) -- RMK 0.9 configuration.
#
# GENERATED by tools/port_zmk_keymap.py from the ZMK config in
# ../zmk-for-moNa2-paw3222 (boards/shields/mona2/mona2.dtsi + config/mona2.keymap).
# Layout, layers, combos, hold-taps and the auto-mouse-layer follow the ZMK
# config; see README.md for the few places where RMK cannot be identical.
#
# Right half = split central (PAW3222 trackball), left half = split peripheral 0
# (EC11 encoder). Composite grid: cols 0..5 = left (6 col pins), cols 6..10 =
# right (5 col pins, col_offset = 6). (0,5) and (1,5) have no switch.

[keyboard]
name = "moNa2"
product_name = "moNa2 PAW3222"
vendor_id = 0x4c4b
product_id = 0x4e32
manufacturer = "razilyis"
chip = "nrf52840"

[layout]
rows = 4
cols = 11
map = """
(0,0,L) (0,1,L) (0,2,L) (0,3,L) (0,4,L) (0,5,L)                 (0,6,R) (0,7,R) (0,8,R) (0,9,R) (0,10,R)
(1,0,L) (1,1,L) (1,2,L) (1,3,L) (1,4,L) (1,5,L)                 (1,6,R) (1,7,R) (1,8,R) (1,9,R) (1,10,R)
(2,0,L) (2,1,L) (2,2,L) (2,3,L) (2,4,L) (2,5,L)                 (2,6,R) (2,7,R) (2,8,R) (2,9,R) (2,10,R)
(3,0,L) (3,1,L) (3,2,L) (3,3,L) (3,4,L) (3,5,L)                 (3,6,R) (3,7,R) (3,8,R) (3,9,R) (3,10,R)
"""

[ble]
enabled = true

[split]
connection = "ble"

# ---- right half: central ----
[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 6
battery_adc_pin = "P0_31"
# XIAO nRF52840 VBAT divider: 1M + 510k
adc_divider_measured = 510
adc_divider_total = 1510

# XIAO VBAT measurement divider enable (P0_14, active low).
[[split.central.output]]
pin = "P0_14"
low_active = true
initial_state_active = true

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P0_03", "P0_28", "P0_29", "P1_11"]
col_pins = ["P1_15", "P1_14", "P1_13", "P1_12", "P0_10"]

# ---- left half: peripheral 0 ----
[[split.peripheral]]
rows = 4
cols = 6
row_offset = 0
col_offset = 0
battery_adc_pin = "P0_31"
adc_divider_measured = 510
adc_divider_total = 1510

[[split.peripheral.output]]
pin = "P0_14"
low_active = true
initial_state_active = true

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_03", "P0_28", "P0_29", "P1_11"]
col_pins = ["P1_15", "P1_14", "P1_13", "P1_12", "P0_10", "P0_09"]

# Left-hand EC11 rotary encoder (A = D5/P0.05, B = D0/P0.02 on the XIAO).
[[split.peripheral.input_device.encoder]]
pin_a = "P0_05"
pin_b = "P0_02"
internal_pullup = true
phase = "resolution"
resolution = 2

[rmk]
split_peripherals_num = 1
ble_profiles_num = 5
# Disabled on purpose. With a non-zero value RMK switches the split peripheral
# link to slow connection parameters while idle, and keys pressed on the left
# half right after a pause were being dropped. Set it to e.g. 600 to trade that
# back for battery life.
split_central_sleep_timeout_seconds = 0
# The ZMK config defines 18 combos.
combo_max_num = 32
combo_max_length = 3

[host]
vial_enabled = true
# Hold the two top-left keys together to unlock Vial configuration.
unlock_keys = [[0, 0], [0, 1]]

# The PAW3222 task in src/central.rs subscribes to layer events.
[event.layer_change]
subs = 2

# ---------------------------------------------------------------------------
# Hold-tap (morse) tuning, ported from the ZMK behaviors
# ---------------------------------------------------------------------------
# `&mt`          : tapping-term 200 ms (default), quick-tap 175 ms, tap-preferred
# `&holdtap`     : 300 ms, quick-tap 250 ms, require-prior-idle 150 ms
# `&lt`/`&paren`/`&uj_*`/`&imeonoff`/`&mkp_layer`: 200 ms
[behavior.morse]
hold_timeout = "200ms"
gap_timeout = "200ms"
# ZMK `&holdtap` uses require-prior-idle-ms = 150; RMK keeps that global.
prior_idle_time = "150ms"

[behavior.morse.profiles]
MT1 = { normal_mode = true, hold_timeout = "200ms", gap_timeout = "200ms", quick_tap_timeout = "175ms" }
HT1 = { normal_mode = true, hold_timeout = "300ms", gap_timeout = "250ms", quick_tap_timeout = "250ms" }
HT2 = { normal_mode = true, hold_timeout = "200ms", gap_timeout = "200ms" }
HT3 = { normal_mode = true, hold_timeout = "200ms", gap_timeout = "200ms" }

# ---------------------------------------------------------------------------
# Mod-morph replacements (RMK forks trigger on the keycode itself)
# ---------------------------------------------------------------------------
[behavior.fork]
forks = [
  # ZMK `slash`: Slash, or Backslash with Shift held
  { trigger = "Slash", negative_output = "Slash", positive_output = "WM(Backslash, LShift)", match_any = "LShift|RShift" },
  # ZMK `BSDEL`: Backspace, or Delete with Shift held (used by &lt_bsdel)
  { trigger = "Backspace", negative_output = "Backspace", positive_output = "Delete", match_any = "LShift|RShift" },
]

# ---------------------------------------------------------------------------
# Auto mouse layer (ZMK: zip_temp_layer 1 700, 500 ms timeout)
# ---------------------------------------------------------------------------
[[behavior.auto_mouse_layer]]
device_id = 0
target_layer = 1
timeout = "500ms"
threshold = 3

[keymap]
layers = 7
[[keymap.layer]]
name = "Base"
keys = """
Q R Minus G Z No Slash TH(C, WM(C, LCtrl), HT1) H L Y
U N I T D No P O K TH(A, WM(A, LCtrl), HT1) S
TH(V, LShift, HT1) TH(Comma, SHIFTED(Kc1), HT1) TH(Dot, SHIFTED(Slash), HT1) M W CapsLock TH(X, WM(X, LCtrl), HT1) TH(E, WM(E, LGui), HT1) B F J
TH(WM(M, LCtrl|LShift), WM(Space, LCtrl), HT1) TH(WM(PageUp, LCtrl), LGui, HT1) TH(WM(PageDown, LCtrl), LAlt, HT1) MouseBtn1 MT(Space, LShift, MT1) MT(Tab, LCtrl, MT1) LT(6, Escape, HT3) Semicolon LT(5, Backspace, HT3) LT(4, Enter, HT3) PrintScreen
"""
encoders = [["AudioVolDown", "AudioVolUp"]
]
[[keymap.layer]]
name = "Mouse"
keys = """
_ _ _ _ _ No _ _ _ _ _
_ _ _ _ _ No _ _ _ _ _
_ _ _ _ _ _ _ MouseBtn1 LT(2, MouseBtn3, HT3) MouseBtn2 _
_ _ _ _ LT(2, MouseBtn3, HT3) LT(3, MouseBtn2, HT3) _ _ _ _ _
"""
encoders = [["AudioVolDown", "AudioVolUp"]
]
[[keymap.layer]]
name = "Scroll"
keys = """
_ _ _ _ _ No _ _ _ _ _
_ _ _ _ _ No _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _
"""
encoders = [["AudioVolDown", "AudioVolUp"]
]
[[keymap.layer]]
name = "Snipe"
keys = """
_ _ _ _ _ No _ _ _ _ _
_ _ _ _ _ No _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _
"""
encoders = [["AudioVolDown", "AudioVolUp"]
]
[[keymap.layer]]
name = "Number"
keys = """
TH(SHIFTED(Kc8), SHIFTED(Quote), HT1) Kc7 Kc8 Kc9 TH(SHIFTED(Equal), SHIFTED(Semicolon), HT1) No TH(SHIFTED(Grave), SHIFTED(Equal), HT1) TH(MACRO(0), MACRO(1), HT2) TH(MACRO(2), MACRO(3), HT2) TH(MACRO(4), MACRO(5), HT2) TH(MACRO(6), MACRO(7), HT2)
TH(Slash, SHIFTED(Kc5), HT1) Kc4 Kc5 Kc6 Minus No Left Down Up Right Backslash
Kc0 Kc1 Kc2 Kc3 TH(SHIFTED(Semicolon), Quote, HT1) NumLock SHIFTED(Kc1) TH(MACRO(10), MACRO(11), HT2) MACRO(12) TH(MACRO(13), MACRO(14), HT2) MACRO(15)
SHIFTED(Kc5) Comma Dot MouseBtn2 MT(Equal, LShift, MT1) MT(Dot, LCtrl, MT1) _ TH(MACRO(8), MACRO(9), HT2) _ _ TH(SHIFTED(Minus), SHIFTED(International1), HT1)
"""
encoders = [["WM(Minus, LCtrl)", "WM(Equal, LShift)"]
]
[[keymap.layer]]
name = "Function"
keys = """
TH(SHIFTED(LeftBracket), SHIFTED(RightBracket), HT1) F7 F8 F9 F12 No Insert Delete PrintScreen Pause TH(SHIFTED(RightBracket), SHIFTED(Backslash), HT1)
TH(SHIFTED(Kc9), SHIFTED(Kc8), HT1) F4 F5 F6 F11 No Home PageDown PageUp End TH(SHIFTED(Kc0), SHIFTED(Kc9), HT1)
TH(LeftBracket, RightBracket, HT1) F1 F2 F3 F10 WM(ScrollLock, LCtrl|LAlt) MediaPrevTrack MediaPlayPause MediaStop MediaNextTrack TH(RightBracket, Backslash, HT1)
WM(Left, LAlt) WM(Right, LAlt) WM(R, LCtrl) MouseBtn3 MT(WM(Z, LCtrl), LShift, MT1) MT(WM(Y, LCtrl), LCtrl, MT1) _ WM(Escape, LCtrl|LShift) _ _ Application
"""
encoders = [["WM(PageDown, LCtrl)", "WM(PageUp, LCtrl)"]
]
[[keymap.layer]]
name = "System"
keys = """
No _ _ No User8 No User8 No _ _ No
_ User3 User4 _ _ No User0 User1 User2 User3 User4
_ User0 User1 User2 User8 User7 User8 _ _ _ _
Bootloader _ _ _ _ _ _ _ _ _ Bootloader
"""
encoders = [["AudioVolDown", "AudioVolUp"]
]

[behavior.combo]
timeout = "50ms"
prior_idle_time = "130ms"
combos = [
  { actions = ["TH(A, WM(A, LCtrl), HT1)", "K"], output = "TH(Language1, WM(Grave, LAlt), HT3)" },  # IME_ON
  { actions = ["S", "TH(A, WM(A, LCtrl), HT1)"], output = "MACRO(16)" },  # win_mv_right
  { actions = ["U", "N"], output = "MACRO(17)" },  # win_mv_left
  { actions = ["TH(V, LShift, HT1)", "J"], output = "TH(MACRO(18), MACRO(19), HT3)" },  # brackets
  { actions = ["U", "S"], output = "TH(MACRO(20), MACRO(21), HT3)" },  # parenthesis
  { actions = ["TH(Comma, SHIFTED(Kc1), HT1)", "TH(V, LShift, HT1)"], output = "TH(WM(F, LCtrl), WM(H, LCtrl), HT1)" },  # find_replace
  { actions = ["K", "O"], output = "TH(WM(V, LCtrl), WM(V, LGui), HT1)" },  # paste
  { actions = ["I", "T"], output = "MACRO(22)" },  # dblsft
  { actions = ["N", "I"], output = "Language2" },  # IME_OFF
  { actions = ["Q", "Y"], output = "TH(MACRO(23), MACRO(24), HT3)" },  # braces
  { actions = ["TH(Dot, SHIFTED(Slash), HT1)", "TH(Comma, SHIFTED(Kc1), HT1)"], output = "WM(Z, LCtrl)" },  # undo
  { actions = ["F", "B"], output = "WM(Y, LCtrl)" },  # redo
  { actions = ["Up", "Down"], output = "WM(Tab, LGui)", layer = 4 },  # taskview
  { actions = ["L", "Y"], output = "TH(WM(W, LCtrl), WM(F4, LAlt), HT1)" },  # close
  { actions = ["H", "L"], output = "WM(Up, LGui)" },  # maximize
  { actions = ["TH(C, WM(C, LCtrl), HT1)", "H"], output = "WM(Down, LGui)" },  # minimize
  { actions = ["Q", "R"], output = "WM(Left, LAlt)" },  # browse_back
  { actions = ["R", "Minus"], output = "WM(Right, LAlt)" },  # browse_forward
]
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "Grave" }]  # backquote
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "SHIFTED(LeftBracket)" }]  # jp_backquote
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "Quote" }]  # quote
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "SHIFTED(Kc7)" }]  # jp_quote
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "SHIFTED(Quote)" }]  # doublequote
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "SHIFTED(Kc2)" }]  # jp_doublequote
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "SHIFTED(Kc6)" }]  # caret
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "Equal" }]  # jp_caret
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "SHIFTED(Backslash)" }]  # pipe
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "SHIFTED(International3)" }]  # jp_pipe
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "SHIFTED(Kc2)" }]  # at
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "LeftBracket" }]  # jp_at
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "SHIFTED(Kc3)" }]  # hash
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "SHIFTED(Kc7)" }]  # amp
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "SHIFTED(Kc6)" }]  # jp_amp
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "SHIFTED(Kc4)" }]  # dollar
[[behavior.macro.macros]]
operations = [{ operation = "down", keycode = "LGui" }, { operation = "tap", keycode = "Right" }, { operation = "up", keycode = "LGui" }]  # winmvright
[[behavior.macro.macros]]
operations = [{ operation = "down", keycode = "LGui" }, { operation = "tap", keycode = "Left" }, { operation = "up", keycode = "LGui" }]  # winmvleft
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "LeftBracket" }, { operation = "tap", keycode = "RightBracket" }, { operation = "tap", keycode = "Left" }]  # brackets
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language1" }, { operation = "tap", keycode = "LeftBracket" }, { operation = "tap", keycode = "RightBracket" }, { operation = "tap", keycode = "Enter" }, { operation = "tap", keycode = "Left" }]  # zen_brackets
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "SHIFTED(Kc9)" }, { operation = "tap", keycode = "SHIFTED(Kc0)" }, { operation = "tap", keycode = "Left" }]  # parenthesis
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language1" }, { operation = "tap", keycode = "SHIFTED(Kc9)" }, { operation = "tap", keycode = "SHIFTED(Kc0)" }, { operation = "tap", keycode = "Enter" }, { operation = "tap", keycode = "Left" }]  # zen_parenthesis
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "LShift" }, { operation = "tap", keycode = "LShift" }]  # DBLSFT
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language2" }, { operation = "tap", keycode = "SHIFTED(LeftBracket)" }, { operation = "tap", keycode = "SHIFTED(RightBracket)" }, { operation = "tap", keycode = "Left" }]  # braces
[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "Language1" }, { operation = "tap", keycode = "SHIFTED(LeftBracket)" }, { operation = "tap", keycode = "SHIFTED(RightBracket)" }, { operation = "tap", keycode = "Enter" }, { operation = "tap", keycode = "Left" }]  # zen_braces
